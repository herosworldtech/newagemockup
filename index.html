<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f6">
  <title>NewAge Prototype — Page Unpublished</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

    :root {
      color-scheme: light;
      font-family: 'DM Sans', sans-serif;
      color: #20252b;
      background: #f3f5f6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --brand-orange: #eb7023;
      --muted: #68717b;
      --line: #e1e5e8;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(16px, 4vw, 40px);
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(235, 112, 35, .09), transparent 52%),
        #f3f5f6;
    }

    .notice {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--line);
      border-top: 4px solid var(--brand-orange);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 20px 55px rgba(23, 32, 40, .1);
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 7px 11px;
      border: 1px solid #f2d2be;
      border-radius: 999px;
      background: #fff7f1;
      color: #8b3c0d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-orange);
      content: "";
    }

    h1 {
      margin: 0;
      color: #20252b;
      font: 800 clamp(25px, 5vw, 38px)/1.15 'Manrope', sans-serif;
      letter-spacing: -.04em;
    }

    .message {
      max-width: 430px;
      margin: 16px auto 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .contact {
      padding-top: 22px;
      border-top: 1px solid #e9ecef;
    }

    .contact h2 {
      margin: 0 0 14px;
      color: #394149;
      font-size: 13px;
      font-weight: 700;
    }

    .contact h2.email-heading { margin-top: 22px; }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      max-width: 100%;
      padding: 10px 14px;
      border: 1px solid #dce1e5;
      border-radius: 5px;
      color: #394149;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
      text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
      border-color: #f0b28b;
      background: #fff8f3;
    }

    .link:focus-visible {
      outline: 3px solid rgba(235, 112, 35, .45);
      outline-offset: 2px;
    }

    .link.primary {
      border-color: #188c57;
      background: #188c57;
      color: #fff;
    }

    .link.primary:hover {
      border-color: #137448;
      background: #137448;
    }

    @media (max-width: 420px) {
      .notice { padding: 28px 20px; }
      .links { flex-direction: column; }
      .link { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="notice">
    <div class="status">PROTOTYPE STATUS</div>
    <h1>PAGE UNPUBLISHED</h1>
    <p class="message">The NewAge Prototype you're requesting have been unpublished.</p>

    <section class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Kindly contact the developer:</h2>
      <div class="links">
        <a class="link primary" href="https://wa.me/2349116799336" target="_blank" rel="noopener noreferrer">+2349116799336 · WhatsApp</a>
        <a class="link" href="https://herosworld.org/" target="_blank" rel="noopener noreferrer">https://herosworld.org/</a>
      </div>
      <h2 class="email-heading">Or send an email:</h2>
      <div class="links">
        <a class="link" href="mailto:davidonos@herosworld.org">davidonos@herosworld.org</a>
      </div>
    </section>
  </main>
</body>
</html>
